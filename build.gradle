plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id "io.freefair.lombok" version "8.11"
}

group = 'com.bracits'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation "org.projectlombok:lombok"
	implementation 'com.itextpdf:kernel:9.0.0'
	implementation 'com.itextpdf:layout:9.0.0'
	implementation 'com.itextpdf:html2pdf:6.0.0'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
	implementation 'com.itextpdf:barcodes:9.0.0'




	implementation 'com.itextpdf:bouncy-castle-adapter:9.0.0'
	implementation 'org.seleniumhq.selenium:selenium-java:4.27.0'
	implementation 'io.github.bonigarcia:webdrivermanager:5.6.4'

	// Playwright for Java — third renderer option (JVM-native CDP, no Node sidecar).
	implementation 'com.microsoft.playwright:playwright:1.60.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
