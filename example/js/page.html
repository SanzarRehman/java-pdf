<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Run JS</title>
</head>
<body>
    <h1>Welcome to My Page</h1>
    <p id="textToChange">This text will change automatically.</p>

    <script>
            document.getElementById("textToChange").innerHTML = "The text has been automatically changed BY JS!";
 
    </script>
</body>
</html>
