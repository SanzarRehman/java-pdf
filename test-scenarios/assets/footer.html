<!DOCTYPE html>
<html>
<head>
    <style>
        .footer {
            width: 100%;
            padding: 10px 0;
            border-top: 1px solid #bdc3c7;
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: #7f8c8d;
        }
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer-left {
            font-size: 9px;
        }
        .footer-center {
            text-align: center;
            flex-grow: 1;
            font-weight: bold;
        }
        .footer-right {
            font-size: 9px;
        }
        .page-number {
            background-color: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="footer">
        <div class="footer-content">
            <div class="footer-left">© 2025 EasyJavaPDF</div>
            <div class="footer-center">
                <span class="page-number">Page 1</span>
            </div>
            <div class="footer-right">Confidential</div>
        </div>
    </div>
</body>
</html>
