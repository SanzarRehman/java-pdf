<!DOCTYPE html>
<html>
<head>
    <style>
        .header {
            width: 100%;
            padding: 10px 0;
            border-bottom: 2px solid #3498db;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #2c3e50;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left {
            font-weight: bold;
        }
        .header-right {
            font-style: italic;
            color: #7f8c8d;
        }
        .header-center {
            text-align: center;
            flex-grow: 1;
            font-size: 14px;
            font-weight: bold;
        }
        @page {
    @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
    }
}
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-left">EasyJavaPDF</div>
            <div class="header-center">Technical Documentation</div>
            <div class="header-right">Version 1.0</div>
        </div>
    </div>
</body>
</html>
