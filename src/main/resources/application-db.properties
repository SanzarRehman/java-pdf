# Activates database-backed report templates. Enable with SPRING_PROFILES_ACTIVE=db
# (plus DB_URL / DB_USER / DB_PASSWORD as needed) — see planning-db-templates.md and
# schema/pgsql.sql + schema/seed-reports.sql.

# Clears the base profile's exclude, so JPA/DataSource auto-config runs.
spring.autoconfigure.exclude=

pdf.report.db.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pdf_service}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin}
# Matches pdf.executor.max-size (application.properties) — at most that many requests
# look up a report key at the same time.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}

# The schema is owned by schema/pgsql.sql, applied by hand (psql/DataGrip) — Hibernate only
# validates the entity mapping against it, never generates or alters DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
