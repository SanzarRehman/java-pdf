spring.application.name=easyJavaPdf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

server.port=8081

# PDF Renderer Configuration
# Options: itext, chromium
# - itext: Uses iText library for PDF generation (full feature support)
# - chromium: Uses Chromium headless via Puppeteer (high-fidelity browser rendering)
# Override per-environment with the PDF_RENDERER env var.
pdf.renderer=${PDF_RENDERER:chromium}

# Persistent warm renderer-server (low-RAM mode).
# When set, renders are routed to a long-lived Node server that keeps ONE shared
# Chromium warm and reuses pages across jobs, instead of spawning Node+Chromium per
# request (~1.4GB each). Started by run.sh / start-renderer.sh, which export this var.
# Leave empty to fall back to per-request spawn (e.g. plain Docker without the sidecar).
pdf.chromium.renderer-server-url=${RENDERER_SERVER_URL:}

# PDF worker executor (single async boundary + load-shedding admission point).
# Bounded pool + bounded queue; when both are full, requests are rejected -> HTTP 503
# (instead of the previous unbounded queue / nested-async deadlock).
# Size core/max to roughly match render capacity (RENDERER_CONCURRENCY / max-processes).
pdf.executor.core-size=${PDF_EXECUTOR_CORE_SIZE:4}
pdf.executor.max-size=${PDF_EXECUTOR_MAX_SIZE:4}
pdf.executor.queue-capacity=${PDF_EXECUTOR_QUEUE_CAPACITY:50}

# Playwright renderer (renderer=playwright) — JVM-native Chromium via CDP, no Node sidecar.
# Experimental third option for comparison alongside itext/chromium. On Alpine it uses the
# system Chromium (executable-path) and system Node (PLAYWRIGHT_NODEJS_PATH) since
# Playwright's own browser downloads are glibc-based.
pdf.playwright.enabled=${PDF_PLAYWRIGHT_ENABLED:true}
pdf.playwright.executable-path=${PDF_PLAYWRIGHT_EXECUTABLE_PATH:/usr/bin/chromium-browser}
# Per-request "mode=fast" reuses a warm page for lower latency at higher RAM. To bound that RAM,
# the reused page is recycled (closed + recreated) after this many renders. Default mode (no
# "mode" param) closes the page after every render and ignores this.
pdf.playwright.reuse-recycle-after=${PDF_PLAYWRIGHT_REUSE_RECYCLE_AFTER:50}

# Auto fit-to-width: shrink over-wide content (e.g. wide tables) to fit the printable page
# width, emulating wkhtmltopdf "smart shrinking". Playwright renderer only — the chromium
# renderer does not support this and always renders at scale 1 (or the per-request "scale"
# override). Per-request overrides: fitToWidth, scale.
pdf.chromium.fit-to-width=false

# Chromium/Puppeteer Configuration (only used when pdf.renderer=chromium)
#pdf.chromium.node-path=node
pdf.chromium.node-path=/home/sakibuihaque/.nvm/versions/node/v20.19.6/bin/node
pdf.chromium.timeout-seconds=600

# Performance: Number of parallel PDF workers.
# Kept at 2 to match the warm server's concurrency cap (RENDERER_CONCURRENCY, max 2).
pdf.chromium.parallel-workers=2

# Hard cap for total Chromium processes spawned by this JVM (weighted for chunked parallelism).
# Aligned to the concurrency cap of 2 so overflow requests queue rather than fan out.
pdf.chromium.max-processes=2

# Default chunked parallelism when not provided per-request.
# (Chunked Chromium uses one browser per worker; keep this small in containers.)
pdf.chromium.chunked-default-parallelism=1

# High quality mode: Use 2x device scale factor for sharper images
# Set to false for faster rendering (1x scale)
pdf.chromium.high-quality=false

# Chunked processing: Files larger than this threshold (MB) will be split
# and processed in parallel chunks for faster generation
pdf.chromium.chunked-threshold-mb=10
