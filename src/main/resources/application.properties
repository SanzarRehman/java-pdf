spring.application.name=easyJavaPdf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

server.port=8081

# PDF Renderer Configuration
# Options: itext (default), chromium
# - itext: Uses iText library for PDF generation (full feature support)
# - chromium: Uses Chromium headless via Puppeteer (high-fidelity browser rendering)
pdf.renderer=itext

# Chromium/Puppeteer Configuration (only used when pdf.renderer=chromium)
pdf.chromium.node-path=node
#pdf.chromium.node-path=/home/sakibuihaque/.nvm/versions/node/v20.19.6/bin/node
pdf.chromium.timeout-seconds=600

# Performance: Number of parallel PDF workers (default: number of CPU cores)
# Increase for I/O-bound workloads, decrease if memory is limited
pdf.chromium.parallel-workers=2

# Hard cap for total Chromium processes spawned by this JVM (weighted for chunked parallelism).
# Default global concurrency cap for Chromium (weighted for chunked parallelism).
pdf.chromium.max-processes=4

# Default chunked parallelism when not provided per-request.
# (Chunked Chromium uses one browser per worker; keep this small in containers.)
pdf.chromium.chunked-default-parallelism=1

# High quality mode: Use 2x device scale factor for sharper images
# Set to false for faster rendering (1x scale)
pdf.chromium.high-quality=false

# Chunked processing: Files larger than this threshold (MB) will be split
# and processed in parallel chunks for faster generation
pdf.chromium.chunked-threshold-mb=10

# Auto fit-to-width: shrink over-wide content (e.g. wide tables) to fit the printable page
# width, emulating wkhtmltopdf "smart shrinking". Per-request overrides: fitToWidth, scale.
pdf.chromium.fit-to-width=false

# Fixed print scale applied when fit-to-width is OFF and no explicit per-request scale is given.
# Chromium prints CSS at full browser size (1.0); the legacy wkhtmltopdf "wk" driver renders
# ~0.726x smaller due to its intrinsic DPI zoom. We default to that factor so output matches the
# wk reference. Content is NOT reflowed — over-wide content still overflows/clips. Set to 1.0 for
# native browser sizing. Per-request override: scale.
pdf.chromium.default-scale=0.769
